services:
  - type: web
    name: routeledger-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: routeledger-db
          property: connectionString
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: ORS_BASE_URL
        value: https://api.heigit.org/openrouteservice
      - key: USE_FAKE_PROVIDER
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_INSIGHTS_ENABLED
        value: "false"

databases:
  - name: routeledger-db
    plan: free
    databaseName: routeledger
    user: routeledger
