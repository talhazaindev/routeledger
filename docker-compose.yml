services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: routeledger
      POSTGRES_USER: routeledger
      POSTGRES_PASSWORD: routeledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://routeledger:routeledger@db:5432/routeledger
      USE_FAKE_PROVIDER: "true"
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db

volumes:
  pgdata:
